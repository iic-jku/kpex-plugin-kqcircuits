[project]
name = "kpex-plugin-kqcircuits"
version = "0.3.0"
description = "Development scaffold for exporting KPEX scenes through KQCircuits to Elmer"
authors = [{ name = "Martin Köhler", email = "info@martinjankoehler.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["pex", "parasitic", "extraction", "klayout", "kqcircuits", "elmer"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["kpex>=0.12.0,<1"]

[project.urls]
repository = "https://github.com/iic-jku/kpex-plugin-kqcircuits"
documentation = "https://github.com/iic-jku/kpex-plugin-kqcircuits#readme"
issues = "https://github.com/iic-jku/kpex-plugin-kqcircuits/issues"

[project.entry-points."klayout_pex.exporters.v1"]
kqcircuits = "klayout_pex_plugins.kqcircuits:create_exporter"

[tool.poetry]
packages = [{ include = "klayout_pex_plugins/kqcircuits", from = "src" }]
include = [
    { path = "tests", format = "sdist" },
    { path = "testdata", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
allure-pytest = ">=2.13.5"
coverage = ">=7.6.8"
twine = ">=6.1,<7"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::EncodingWarning"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
